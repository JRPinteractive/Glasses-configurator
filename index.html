<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glasses Configurator</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #1a1a1e;
      }

      body {
        overflow: hidden;
      }

      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script>
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a1e);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      );
      camera.position.set(0, 0, 10);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      // Brighter ambient light
      const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
      scene.add(ambientLight);

      // Strong directional light for shine
      const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
      directionalLight.position.set(5, 8, 5);
      directionalLight.castShadow = true;
      scene.add(directionalLight);

      // Fill light
      const fillLight = new THREE.DirectionalLight(0xffffff, 0.6);
      fillLight.position.set(-5, -2, 3);
      scene.add(fillLight);

      const productGroup = new THREE.Group();
      scene.add(productGroup);

      // Realistic glasses structure
      const glassesGroup = new THREE.Group();
      productGroup.add(glassesGroup);

      // Lens material - flat, semi-transparent with slight tint
      const lensMaterial = new THREE.MeshStandardMaterial({
        color: 0x88ccff,
        metalness: 0.3,
        roughness: 0.1,
        transparent: true,
        opacity: 0.7,
        side: THREE.DoubleSide
      });

      // Frame material - metallic
      const frameMaterial = new THREE.MeshStandardMaterial({
        color: 0x2a2a2a,
        metalness: 0.8,
        roughness: 0.2
      });

      // LEFT LENS - flat disc
      const lensGeometry = new THREE.CylinderGeometry(0.6, 0.6, 0.05, 32);
      const leftLens = new THREE.Mesh(lensGeometry, lensMaterial);
      leftLens.position.set(-1.0, 0, 0);
      leftLens.rotation.y = 0.1; // slight angle
      glassesGroup.add(leftLens);

      // LEFT FRAME - ring around lens
      const frameGeometry = new THREE.TorusGeometry(0.65, 0.08, 16, 100);
      const leftFrame = new THREE.Mesh(frameGeometry, frameMaterial);
      leftFrame.position.set(-1.0, 0, 0);
      leftFrame.rotation.y = 0.1;
      glassesGroup.add(leftFrame);

      // RIGHT LENS - flat disc
      const rightLens = new THREE.Mesh(lensGeometry, lensMaterial);
      rightLens.position.set(1.0, 0, 0);
      rightLens.rotation.y = -0.1; // slight angle
      glassesGroup.add(rightLens);

      // RIGHT FRAME - ring around lens
      const rightFrame = new THREE.Mesh(frameGeometry, frameMaterial);
      rightFrame.position.set(1.0, 0, 0);
      rightFrame.rotation.y = -0.1;
      glassesGroup.add(rightFrame);

      // BRIDGE - connecting the two frames
      const bridgeGeometry = new THREE.BoxGeometry(0.4, 0.15, 0.08);
      const bridge = new THREE.Mesh(bridgeGeometry, frameMaterial);
      bridge.position.set(0, 0, 0);
      glassesGroup.add(bridge);

      // LEFT ARM/TEMPLE - extends back
      const armGeometry = new THREE.BoxGeometry(0.1, 0.12, 1.8);
      const leftArm = new THREE.Mesh(armGeometry, frameMaterial);
      leftArm.position.set(-1.0, -0.15, -0.9);
      leftArm.rotation.z = 0.05;
      glassesGroup.add(leftArm);

      // RIGHT ARM/TEMPLE - extends back
      const rightArm = new THREE.Mesh(armGeometry, frameMaterial);
      rightArm.position.set(1.0, -0.15, -0.9);
      rightArm.rotation.z = -0.05;
      glassesGroup.add(rightArm);

      // Slight overall tilt for better viewing
      glassesGroup.rotation.x = 0.15;

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }

      animate();
    </script>
  </body>
</html>
