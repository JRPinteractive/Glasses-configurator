<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glasses Configurator</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #1a1a1e;
      }

      body {
        overflow: hidden;
      }

      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script>
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a1e);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      );
      camera.position.set(0, 0, 10);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      // Brighter ambient light to lift the background
      const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
      scene.add(ambientLight);

      // Strong directional light for definition and shine
      const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
      directionalLight.position.set(5, 8, 5);
      directionalLight.castShadow = true;
      scene.add(directionalLight);

      // Fill light for soft shadows
      const fillLight = new THREE.DirectionalLight(0xffffff, 0.6);
      fillLight.position.set(-5, -2, 3);
      scene.add(fillLight);

      const productGroup = new THREE.Group();
      scene.add(productGroup);

      // Create glasses with two lenses
      const glassesGroup = new THREE.Group();
      productGroup.add(glassesGroup);

      // Left lens - glossy sphere
      const lensGeometry = new THREE.IcosahedronGeometry(0.8, 16);
      const lensMaterial = new THREE.MeshStandardMaterial({
        color: 0xcccccc,
        metalness: 0.9,
        roughness: 0.1,
        envMapIntensity: 1.0
      });
      const leftLens = new THREE.Mesh(lensGeometry, lensMaterial);
      leftLens.position.x = -1.2;
      glassesGroup.add(leftLens);

      // Right lens - glossy sphere
      const rightLens = new THREE.Mesh(lensGeometry, lensMaterial);
      rightLens.position.x = 1.2;
      glassesGroup.add(rightLens);

      // Bridge - connecting cylinder
      const bridgeGeometry = new THREE.CylinderGeometry(0.1, 0.1, 0.8, 16);
      const bridgeMaterial = new THREE.MeshStandardMaterial({
        color: 0xaaaaaa,
        metalness: 0.8,
        roughness: 0.2
      });
      const bridge = new THREE.Mesh(bridgeGeometry, bridgeMaterial);
      bridge.rotation.z = Math.PI / 2;
      glassesGroup.add(bridge);

      // Slight rotation for better viewing angle
      glassesGroup.rotation.x = 0.1;

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }

      animate();
    </script>
  </body>
</html>
